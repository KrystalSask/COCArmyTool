[package]
name = "coc-army-tool"
version = "0.3.0"
description = "COCArmyTool Windows 桌面应用"
authors = ["Yan Yushuai"]
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/KrystalSask/COCArmyTool"

[lib]
name = "coc_army_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
